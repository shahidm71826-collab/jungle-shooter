<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Jungle Gun Shooter</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#071008;
    touch-action:none;
    user-select:none;
    font-family:Arial,sans-serif;
}

/* ================= START ================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;

    background:
    radial-gradient(circle at center,
    rgba(35,90,40,.65),
    rgba(0,0,0,.96));
}

#startScreen h1{
    font-size:42px;
    margin:0;
    color:#ff3131;
    text-shadow:0 0 20px red;
}

#startScreen p{
    line-height:1.7;
    color:#ddd;
}

#startBtn{
    margin-top:18px;
    padding:15px 55px;
    border:2px solid white;
    border-radius:10px;
    background:#d71920;
    color:white;
    font-size:20px;
    font-weight:bold;
}

/* ================= TIMER ================= */

#timer{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;

    padding:8px 25px;
    min-width:130px;

    background:rgba(0,0,0,.75);
    border:1px solid rgba(255,255,255,.25);
    border-radius:8px;

    color:white;
    text-align:center;
    font-size:23px;
    font-weight:bold;
}

#timer.warning{
    color:#ff3434;
    box-shadow:0 0 15px red;
}

/* ================= KILLS ================= */

#topHud{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    margin-top:60px;

    z-index:30;

    padding:7px 25px;
    background:rgba(0,0,0,.72);
    border-radius:7px;

    color:white;
    font-weight:bold;
}

#score{
    color:#ff3333;
    font-size:25px;
}

/* ================= HEALTH ================= */

#healthBox{
    position:fixed;
    right:20px;
    top:18px;
    width:250px;
    height:48px;

    background:rgba(0,0,0,.72);
    border-radius:7px;
    z-index:30;
}

#healthIcon{
    position:absolute;
    left:12px;
    top:5px;
    font-size:29px;
    color:white;
}

#healthOuter{
    position:absolute;
    left:62px;
    right:10px;
    top:10px;
    height:28px;
    background:#222;
}

#healthBar{
    width:100%;
    height:100%;
    background:#22c522;
    transition:.2s;
}

#healthText{
    position:absolute;
    right:17px;
    top:10px;
    color:white;
    font-weight:bold;
    line-height:28px;
}

/* ================= GUN PANEL ================= */

#gunPanel{
    position:fixed;
    left:18px;
    top:175px;

    width:270px;
    padding:8px;

    display:flex;
    gap:6px;

    background:rgba(5,10,6,.86);
    border:1px solid rgba(255,255,255,.25);
    border-radius:9px;

    z-index:40;
}

.gunChoice{
    flex:1;
    min-height:70px;

    border:1px solid #555;
    border-radius:6px;

    background:#151815;
    color:white;

    font-size:11px;
    font-weight:bold;
}

.gunChoice.active{
    border:2px solid #ffc400;
    color:#ffc400;
    box-shadow:0 0 10px rgba(255,190,0,.35);
}

.weaponSmall{
    display:block;
    font-size:23px;
    margin-bottom:5px;
}

/* ================= CROSSHAIR ================= */

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:42px;
    height:42px;
    transform:translate(-50%,-50%);
    z-index:20;
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
}

#crosshair:before{
    width:3px;
    height:42px;
    left:19px;
}

#crosshair:after{
    height:3px;
    width:42px;
    top:19px;
}

.crossDot{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#fff;
    left:18px;
    top:18px;
}

/* ================= JOYSTICK ================= */

#joystickBase{
    position:fixed;
    left:25px;
    bottom:25px;

    width:145px;
    height:145px;

    border-radius:50%;

    background:rgba(10,15,10,.58);
    border:2px solid rgba(255,255,255,.45);

    z-index:50;
}

#joystickStick{
    position:absolute;

    left:42px;
    top:42px;

    width:60px;
    height:60px;

    border-radius:50%;

    background:rgba(245,245,245,.88);
    border:2px solid white;
}

.jArrow{
    position:absolute;
    color:rgba(255,255,255,.7);
    font-size:18px;
}

.up{
    top:5px;
    left:64px;
}

.down{
    bottom:5px;
    left:64px;
}

.left{
    left:7px;
    top:62px;
}

.right{
    right:7px;
    top:62px;
}

/* ================= FIRE BUTTON ================= */

#shootBtn{
    position:fixed;
    right:28px;
    bottom:150px;

    width:115px;
    height:115px;

    border-radius:50%;
    border:4px solid white;

    background:
    radial-gradient(circle,#4a4a4a,#101010);

    z-index:50;

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:0 0 18px rgba(255,255,255,.25);
}

#shootBtn:active{
    transform:scale(.91);
}

.gunIcon{
    width:54px;
    height:25px;
    background:#ddd;
    border-radius:5px;
    position:relative;
    transform:rotate(-8deg);
}

.gunIcon:before{
    content:"";
    position:absolute;
    width:24px;
    height:14px;
    left:8px;
    bottom:-11px;
    background:#aaa;
    transform:skew(-12deg);
}

.gunIcon:after{
    content:"";
    position:absolute;
    width:24px;
    height:5px;
    right:-21px;
    top:9px;
    background:#bbb;
}

/* ================= ZOOM ================= */

#zoomBtn{
    position:fixed;
    right:155px;
    bottom:145px;

    width:75px;
    height:75px;

    border-radius:50%;
    border:2px solid white;

    background:rgba(0,0,0,.72);
    color:white;

    font-size:30px;
    z-index:50;
}

#zoomBtn.active{
    background:#d99b00;
}

/* ================= BOMB ================= */

#bombBtn{
    position:fixed;
    right:32px;
    bottom:45px;

    width:75px;
    height:75px;

    border-radius:50%;
    border:2px solid white;

    background:rgba(0,0,0,.72);
    color:white;

    font-size:30px;

    z-index:50;
}

#bombCount{
    position:absolute;
    right:-3px;
    top:-3px;

    width:25px;
    height:25px;

    background:#e51b23;
    border-radius:50%;

    color:white;
    font-size:14px;
    line-height:25px;
}

/* ================= RELOAD ================= */

#reload{
    position:fixed;
    right:125px;
    bottom:48px;

    width:62px;
    height:62px;

    border-radius:50%;
    border:2px solid white;

    background:rgba(0,0,0,.7);
    color:white;

    font-size:25px;

    z-index:50;
}

/* ================= AMMO ================= */

#ammo{
    position:fixed;
    right:210px;
    bottom:58px;

    z-index:40;

    color:white;
    font-size:23px;
    font-weight:bold;

    text-shadow:2px 2px #000;
}

#currentAmmo{
    color:#ffd000;
}

/* ================= HIT ================= */

#hitFlash{
    position:fixed;
    inset:0;

    background:rgba(255,0,0,.25);

    z-index:18;
    display:none;

    pointer-events:none;
}

#damageText{
    position:fixed;
    left:50%;
    top:60%;

    transform:translate(-50%,-50%);

    color:#ff3333;
    font-size:25px;
    font-weight:bold;

    display:none;
    z-index:80;
}

/* ================= ZOOM OVERLAY ================= */

#zoomText{
    position:fixed;
    left:50%;
    bottom:20%;
    transform:translateX(-50%);

    color:#ffe600;
    font-weight:bold;

    display:none;
    z-index:60;
}

/* ================= GAME OVER ================= */

#gameOver{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.82);

    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;
    z-index:500;
    text-align:center;
}

#gameOver h1{
    color:#ff3333;
    font-size:40px;
}

#restartBtn{
    padding:14px 45px;
    background:#d71920;
    color:white;
    border:0;
    border-radius:8px;
    font-size:20px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    #gunPanel{
        top:125px;
        left:8px;
        width:245px;
    }

    .gunChoice{
        min-height:60px;
        font-size:9px;
    }

    #healthBox{
        width:175px;
        right:8px;
        top:10px;
    }

    #timer{
        top:10px;
        font-size:19px;
        min-width:105px;
    }

    #topHud{
        margin-top:48px;
        font-size:12px;
    }

    #joystickBase{
        width:125px;
        height:125px;
        left:15px;
        bottom:18px;
    }

    #joystickStick{
        left:36px;
        top:36px;
        width:54px;
        height:54px;
    }

    #shootBtn{
        width:100px;
        height:100px;
        right:18px;
        bottom:130px;
    }

    #zoomBtn{
        width:65px;
        height:65px;
        right:130px;
        bottom:138px;
    }

    #bombBtn{
        width:65px;
        height:65px;
        right:20px;
        bottom:25px;
    }

    #reload{
        width:58px;
        height:58px;
        right:105px;
        bottom:30px;
    }

    #ammo{
        right:175px;
        bottom:40px;
        font-size:18px;
    }
}
</style>
</head>

<body>

<!-- START -->

<div id="startScreen">

    <h1>🌲 JUNGLE SHOOTER</h1>

    <p>
        🌲 Forest Mission<br>
        🔫 Select Weapon<br>
        🎯 Aim • Zoom • Shoot<br>
        💣 Use Bombs
    </p>

    <button id="startBtn">
        START GAME
    </button>

</div>


<!-- TIMER -->

<div id="timer">
    ⏱️ <span id="time">120</span>
</div>


<!-- KILLS -->

<div id="topHud">
    💀 KILLS:
    <span id="score">0</span>
</div>


<!-- HEALTH -->

<div id="healthBox">

    <div id="healthIcon">✚</div>

    <div id="healthOuter">
        <div id="healthBar"></div>
    </div>

    <div id="healthText">100</div>

</div>


<!-- CROSSHAIR -->

<div id="crosshair">
    <div class="crossDot"></div>
</div>


<div id="hitFlash"></div>

<div id="damageText">
    -10 HP
</div>


<div id="zoomText">
    🔍 ZOOM ON
</div>


<!-- GUN SELECT -->

<div id="gunPanel">

    <button class="gunChoice active"
            data-gun="0">

        <span class="weaponSmall">🔫</span>
        PISTOL

    </button>

    <button class="gunChoice"
            data-gun="1">

        <span class="weaponSmall">🔫</span>
        SMG

    </button>

    <button class="gunChoice"
            data-gun="2">

        <span class="weaponSmall">🔫</span>
        RIFLE

    </button>

    <button class="gunChoice"
            data-gun="3">

        <span class="weaponSmall">🔫</span>
        SHOTGUN

    </button>

</div>


<!-- JOYSTICK -->

<div id="joystickBase">

    <div class="jArrow up">▲</div>
    <div class="jArrow down">▼</div>
    <div class="jArrow left">◀</div>
    <div class="jArrow right">▶</div>

    <div id="joystickStick"></div>

</div>


<!-- FIRE -->

<button id="shootBtn">

    <div class="gunIcon"></div>

</button>


<!-- ZOOM -->

<button id="zoomBtn">
    🔍
</button>


<!-- RELOAD -->

<button id="reload">
    ↻
</button>


<!-- BOMB -->

<button id="bombBtn">

    💣

    <span id="bombCount">
        3
    </span>

</button>


<!-- AMMO -->

<div id="ammo">

    <span id="currentAmmo">12</span>
    /
    <span id="maxAmmo">120</span>

</div>


<!-- GAME OVER -->

<div id="gameOver">

    <h1>MISSION COMPLETE</h1>

    <p>
        Kills:
        <span id="finalScore">0</span>
    </p>

    <button id="restartBtn">
        PLAY AGAIN
    </button>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =====================================================
   GAME VARIABLES
===================================================== */

let scene;
let camera;
let renderer;

let enemies=[];
let trees=[];

let score=0;
let health=100;

let gameActive=false;

let currentGun=0;

let ammo=12;
let maxAmmo=120;

let bombs=3;

let lon=0;
let lat=0;

let moveX=0;
let moveY=0;

let joystickTouchId=null;
let lookTouchId=null;
let shootTouchId=null;

let joystickCenter={
    x:0,
    y:0
};

let lookX=0;
let lookY=0;

let firing=false;
let zoomed=false;

let lastShot=0;
let lastDamage=0;

let timeLeft=120;
let timerInterval;

let audioCtx;

let handGroup;
let gunMesh;
let muzzle;


/* =====================================================
   DOM
===================================================== */

const startScreen=
document.getElementById("startScreen");

const startBtn=
document.getElementById("startBtn");

const shootBtn=
document.getElementById("shootBtn");

const joystickBase=
document.getElementById("joystickBase");

const joystickStick=
document.getElementById("joystickStick");

const scoreEl=
document.getElementById("score");

const healthBar=
document.getElementById("healthBar");

const healthText=
document.getElementById("healthText");

const currentAmmo=
document.getElementById("currentAmmo");

const maxAmmoEl=
document.getElementById("maxAmmo");

const gunChoices=
document.querySelectorAll(".gunChoice");

const hitFlash=
document.getElementById("hitFlash");

const damageText=
document.getElementById("damageText");

const zoomBtn=
document.getElementById("zoomBtn");

const zoomText=
document.getElementById("zoomText");

const bombBtn=
document.getElementById("bombBtn");

const bombCount=
document.getElementById("bombCount");

const timeEl=
document.getElementById("time");

const gameOver=
document.getElementById("gameOver");

const finalScore=
document.getElementById("finalScore");

const restartBtn=
document.getElementById("restartBtn");


/* =====================================================
   START
===================================================== */

startBtn.onclick=()=>{

    startScreen.style.display="none";

    gameActive=true;

    if(!audioCtx){

        audioCtx=
        new(window.AudioContext||
        window.webkitAudioContext)();

    }

    init();

    startTimer();

    animate();

};


/* =====================================================
   INIT
===================================================== */

function init(){

    scene=new THREE.Scene();

    /* JUNGLE SKY */

    scene.background=
    new THREE.Color(0x73a8d1);

    scene.fog=
    new THREE.Fog(
        0x73a8d1,
        20,
        120
    );


    /* CAMERA */

    camera=
    new THREE.PerspectiveCamera(
        75,
        innerWidth/innerHeight,
        .1,
        1000
    );

    camera.position.set(
        0,
        2,
        0
    );


    /* RENDERER */

    renderer=
    new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,2)
    );

    document.body.appendChild(
        renderer.domElement
    );


    /* LIGHT */

    scene.add(
        new THREE.HemisphereLight(
            0xbde7ff,
            0x263b1e,
            1.1
        )
    );

    const sun=
    new THREE.DirectionalLight(
        0xffffff,
        1
    );

    sun.position.set(
        30,
        60,
        20
    );

    scene.add(sun);


    /* GROUND */

    const ground=
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            300,
            300
        ),

        new THREE.MeshLambertMaterial({
            color:0x294829
        })

    );

    ground.rotation.x=
    -Math.PI/2;

    scene.add(ground);


    createJungle();

    createWeapon();

    scene.add(camera);


    /* ENEMIES */

    for(let i=0;i<8;i++){
        spawnEnemy();
    }


    setInterval(()=>{

        if(
            gameActive &&
            enemies.length<15
        ){
            spawnEnemy();
        }

    },2500);


    setupControls();

    updateAmmo();

}


/* =====================================================
   JUNGLE
===================================================== */

function createJungle(){

    /* GRASS / ROCKS */

    for(let i=0;i<80;i++){

        const rock=
        new THREE.Mesh(

            new THREE.DodecahedronGeometry(
                .4+Math.random()*.8
            ),

            new THREE.MeshLambertMaterial({
                color:
                0x314331
            })

        );

        const angle=
        Math.random()*Math.PI*2;

        const radius=
        10+Math.random()*100;

        rock.position.set(

            Math.cos(angle)*radius,

            .3,

            Math.sin(angle)*radius

        );

        scene.add(rock);

    }


    /* TREES */

    for(let i=0;i<90;i++){

        const tree=
        new THREE.Group();


        const trunk=
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .35,
                .6,
                5,
                8
            ),

            new THREE.MeshLambertMaterial({
                color:0x5a351d
            })

        );

        trunk.position.y=2.5;

        tree.add(trunk);


        const leaves=
        new THREE.Mesh(

            new THREE.ConeGeometry(
                2.5,
                6,
                8
            ),

            new THREE.MeshLambertMaterial({
                color:0x174b22
            })

        );

        leaves.position.y=6;

        tree.add(leaves);


        const angle=
        Math.random()*Math.PI*2;

        const radius=
        15+Math.random()*105;

        tree.position.set(

            Math.cos(angle)*radius,

            0,

            Math.sin(angle)*radius

        );

        const scale=
        .7+Math.random()*1.5;

        tree.scale.setScalar(scale);

        scene.add(tree);

        trees.push(tree);

    }

}


/* =====================================================
   WEAPON
===================================================== */

function createWeapon(){

    handGroup=
    new THREE.Group();

    camera.add(handGroup);


    /* HAND */

    const hand=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .38,
            .38,
            .9
        ),

        new THREE.MeshLambertMaterial({
            color:0x9b6b45
        })

    );

    hand.position.set(
        .55,
        -.55,
        -.8
    );

    handGroup.add(hand);


    /* GUN */

    gunMesh=
    new THREE.Group();


    const body=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .23,
            .23,
            .9
        ),

        new THREE.MeshLambertMaterial({
            color:0x151515
        })

    );

    gunMesh.add(body);


    const barrel=
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .045,
            .045,
            .85,
            8
        ),

        new THREE.MeshLambertMaterial({
            color:0x050505
        })

    );

    barrel.rotation.x=
    Math.PI/2;

    barrel.position.z=
    -.75;

    gunMesh.add(barrel);


    /* MUZZLE FLASH */

    muzzle=
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .13,
            8,
            8
        ),

        new THREE.MeshBasicMaterial({
            color:0xffaa00
        })

    );

    muzzle.position.z=
    -1.18;

    muzzle.visible=false;

    gunMesh.add(muzzle);


    gunMesh.position.set(
        .02,
        .1,
        -.5
    );

    hand.add(gunMesh);


    updateGunModel();

}


/* =====================================================
   GUN CHANGE
===================================================== */

gunChoices.forEach(btn=>{

    btn.addEventListener(
        "click",
        ()=>{

            currentGun=
            Number(btn.dataset.gun);


            gunChoices.forEach(
                b=>
                b.classList.remove(
                    "active"
                )
            );


            btn.classList.add(
                "active"
            );


            if(currentGun===0){

                ammo=12;
                maxAmmo=120;

            }

            if(currentGun===1){

                ammo=30;
                maxAmmo=180;

            }

            if(currentGun===2){

                ammo=25;
                maxAmmo=200;

            }

            if(currentGun===3){

                ammo=6;
                maxAmmo=60;

            }


            updateGunModel();

            updateAmmo();

        }
    );

});


function updateGunModel(){

    if(!gunMesh)
        return;


    let scale=1;


    if(currentGun===0)
        scale=.9;


    if(currentGun===1)
        scale=1.15;


    if(currentGun===2)
        scale=1.3;


    if(currentGun===3)
        scale=1.5;


    gunMesh.scale.set(
        scale,
        scale,
        scale
    );

}


/* =====================================================
   CONTROLS
===================================================== */

function setupControls(){

    /* JOYSTICK TOUCH */

    window.addEventListener(
        "touchstart",
        e=>{

            for(
                const t of
                e.changedTouches
            ){

                if(

                    t.clientX<
                    innerWidth*.48 &&

                    joystickTouchId===null

                ){

                    joystickTouchId=
                    t.identifier;


                    const rect=
                    joystickBase
                    .getBoundingClientRect();


                    joystickCenter.x=
                    rect.left+
                    rect.width/2;


                    joystickCenter.y=
                    rect.top+
                    rect.height/2;

                }

                else if(

                    t.clientX>=
                    innerWidth*.48 &&

                    lookTouchId===null &&

                    !shootBtn.contains(t.target) &&

                    !zoomBtn.contains(t.target) &&

                    !bombBtn.contains(t.target) &&

                    !document
                    .getElementById("gunPanel")
                    .contains(t.target)

                ){

                    lookTouchId=
                    t.identifier;

                    lookX=t.pageX;
                    lookY=t.pageY;

                }

            }

        },
        {passive:false}
    );


    /* FIRE */

    shootBtn.addEventListener(
        "touchstart",
        e=>{

            e.preventDefault();

            firing=true;

            shootTouchId=
            e.changedTouches[0]
            .identifier;

        },
        {passive:false}
    );


    shootBtn.addEventListener(
        "mousedown",
        ()=>{
            firing=true;
        }
    );


    window.addEventListener(
        "mouseup",
        ()=>{
            firing=false;
        }
    );


    /* TOUCH MOVE */

    window.addEventListener(
        "touchmove",
        e=>{

            e.preventDefault();


            for(
                const t of
                e.changedTouches
            ){

                /* MOVEMENT */

                if(
                    t.identifier===
                    joystickTouchId
                ){

                    let dx=
                    t.clientX-
                    joystickCenter.x;

                    let dy=
                    t.clientY-
                    joystickCenter.y;

                    const max=45;

                    const distance=
                    Math.hypot(
                        dx,
                        dy
                    );


                    if(distance>max){

                        dx=
                        dx/distance*max;

                        dy=
                        dy/distance*max;

                    }


                    joystickStick.style.transform=
                    `translate(${dx}px,${dy}px)`;


                    moveX=
                    dx/max;

                    moveY=
                    dy/max;

                }


                /* CAMERA LOOK */

                if(
                    t.identifier===
                    lookTouchId
                ){

                    let dx=
                    t.pageX-lookX;

                    let dy=
                    t.pageY-lookY;


                    lon+=
                    dx*(zoomed?.13:.25);

                    lat-=
                    dy*(zoomed?.13:.25);


                    lat=
                    Math.max(
                        -80,
                        Math.min(
                            80,
                            lat
                        )
                    );


                    lookX=t.pageX;
                    lookY=t.pageY;


                    updateCamera();

                }

            }

        },
        {passive:false}
    );


    /* TOUCH END */

    window.addEventListener(
        "touchend",
        e=>{

            for(
                const t of
                e.changedTouches
            ){

                if(
                    t.identifier===
                    joystickTouchId
                ){

                    joystickTouchId=null;

                    moveX=0;
                    moveY=0;

                    joystickStick.style.transform=
                    "translate(0,0)";

                }


                if(
                    t.identifier===
                    lookTouchId
                ){

                    lookTouchId=null;

                }


                if(
                    t.identifier===
                    shootTouchId
                ){

                    shootTouchId=null;

                    firing=false;

                }

            }

        }
    );


    /* KEYBOARD */

    window.addEventListener(
        "keydown",
        e=>{

            if(e.key==="w")
                moveY=-1;

            if(e.key==="s")
                moveY=1;

            if(e.key==="a")
                moveX=-1;

            if(e.key==="d")
                moveX=1;

            if(e.code==="Space")
                firing=true;

        }
    );


    window.addEventListener(
        "keyup",
        e=>{

            if(
                ["w","s"]
                .includes(e.key)
            )
                moveY=0;

            if(
                ["a","d"]
                .includes(e.key)
            )
                moveX=0;

            if(e.code==="Space")
                firing=false;

        }
    );


    /* RELOAD */

    document
    .getElementById("reload")
    .onclick=reload;


    /* ZOOM */

    zoomBtn.onclick=toggleZoom;


    /* BOMB */

    bombBtn.onclick=throwBomb;

}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

    const phi=
    THREE.MathUtils.degToRad(
        90-lat
    );

    const theta=
    THREE.MathUtils.degToRad(
        lon
    );


    const target=
    new THREE.Vector3();


    target.x=
    camera.position.x+
    100*Math.sin(phi)*
    Math.cos(theta);


    target.y=
    camera.position.y+
    100*Math.cos(phi);


    target.z=
    camera.position.z+
    100*Math.sin(phi)*
    Math.sin(theta);


    camera.lookAt(target);


    handGroup.rotation.x=
    THREE.MathUtils.degToRad(
        -lat*.35
    );

}


/* =====================================================
   ZOOM
===================================================== */

function toggleZoom(){

    zoomed=!zoomed;


    zoomBtn.classList.toggle(
        "active",
        zoomed
    );


    zoomText.style.display=
    zoomed?
    "block":
    "none";


    camera.fov=
    zoomed?
    35:
    75;


    camera.updateProjectionMatrix();

}


/* =====================================================
   ENEMY
===================================================== */

function spawnEnemy(){

    const enemy=
    new THREE.Group();


    /* HEAD */

    const head=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .65,
            .65,
            .65
        ),

        new THREE.MeshLambertMaterial({
            color:0x916c4d
        })

    );

    head.position.y=2.8;

    enemy.add(head);


    /* MASK */

    const mask=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .46,
            .25,
            .1
        ),

        new THREE.MeshLambertMaterial({
            color:0x090909
        })

    );

    mask.position.set(
        0,
        2.82,
        -.34
    );

    enemy.add(mask);


    /* BODY */

    const body=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1,
            1.25,
            .65
        ),

        new THREE.MeshLambertMaterial({
            color:0x161c16
        })

    );

    body.position.y=1.9;

    enemy.add(body);


    /* ARMS */

    const armMat=
    new THREE.MeshLambertMaterial({
        color:0x151a15
    });


    const leftArm=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .3,
            1,
            .3
        ),

        armMat

    );

    leftArm.position.set(
        -.65,
        1.9,
        0
    );

    enemy.add(leftArm);


    const rightArm=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .3,
            1,
            .3
        ),

        armMat

    );

    rightArm.position.set(
        .65,
        1.9,
        0
    );

    enemy.add(rightArm);


    /* LEGS */

    const legMat=
    new THREE.MeshLambertMaterial({
        color:0x101410
    });


    const leftLeg=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .4,
            1.2,
            .4
        ),

        legMat

    );

    leftLeg.position.set(
        -.25,
        .6,
        0
    );

    enemy.add(leftLeg);


    const rightLeg=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .4,
            1.2,
            .4
        ),

        legMat

    );

    rightLeg.position.set(
        .25,
        .6,
        0
    );

    enemy.add(rightLeg);


    /* ENEMY WEAPON */

    const enemyGun=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .15,
            .15,
            .9
        ),

        new THREE.MeshLambertMaterial({
            color:0x050505
        })

    );

    enemyGun.rotation.x=
    Math.PI/2;

    enemyGun.position.set(
        0,
        1.75,
        -.55
    );

    enemy.add(enemyGun);


    /* POSITION */

    const angle=
    Math.random()*Math.PI*2;

    const radius=
    30+Math.random()*55;


    enemy.position.set(

        Math.cos(angle)*radius,

        0,

        Math.sin(angle)*radius

    );


    enemy.legs=[
        leftLeg,
        rightLeg
    ];

    enemy.arms=[
        leftArm,
        rightArm
    ];


    enemy.hp=1;


    scene.add(enemy);

    enemies.push(enemy);

}


/* =====================================================
   SHOOT
===================================================== */

function shoot(){

    if(ammo<=0){

        reload();

        return;

    }


    const now=Date.now();


    let interval=150;


    if(currentGun===1)
        interval=85;


    if(currentGun===2)
        interval=170;


    if(currentGun===3)
        interval=500;


    if(now-lastShot<interval)
        return;


    lastShot=now;


    ammo--;

    updateAmmo();


    gunRecoil();

    muzzleFlash();

    playSound();


    /* RAY */

    const raycaster=
    new THREE.Raycaster();


    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );


    const hits=
    raycaster.intersectObjects(
        enemies,
        true
    );


    if(hits.length){

        let enemy=
        hits[0].object;


        while(
            enemy.parent &&
            !enemies.includes(enemy)
        ){

            enemy=
            enemy.parent;

        }


        if(
            enemies.includes(enemy)
        ){

            killEnemy(enemy);

        }

    }

}


/* =====================================================
   MUZZLE FLASH
===================================================== */

function muzzleFlash(){

    if(!muzzle)
        return;


    muzzle.visible=true;


    setTimeout(
        ()=>{
            if(muzzle)
                muzzle.visible=false;
        },
        55
    );

}


/* =====================================================
   KILL ENEMY
===================================================== */

function killEnemy(enemy){

    hitFlash.style.display=
    "block";


    setTimeout(
        ()=>{
            hitFlash.style.display=
            "none";
        },
        40
    );


    enemy.children.forEach(
        c=>{

            if(
                c.material &&
                c.material.color
            ){

                c.material.color
                .setHex(0xff0000);

            }

        }
    );


    setTimeout(
        ()=>{

            scene.remove(enemy);


            enemies=
            enemies.filter(
                e=>e!==enemy
            );


            score++;

            scoreEl.innerText=
            score;

        },
        100
    );

}


/* =====================================================
   GUN RECOIL
===================================================== */

function gunRecoil(){

    if(!gunMesh)
        return;


    gunMesh.position.z=
    .12;


    gunMesh.rotation.x=
    -.08;


    setTimeout(
        ()=>{

            if(gunMesh){

                gunMesh.position.z=
                -.5;

                gunMesh.rotation.x=0;

            }

        },
        65
    );

}


/* =====================================================
   BOMB
===================================================== */

function throwBomb(){

    if(bombs<=0)
        return;


    bombs--;

    bombCount.innerText=
    bombs;


    const bomb=
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .25,
            12,
            12
        ),

        new THREE.MeshLambertMaterial({
            color:0x222222
        })

    );


    bomb.position.copy(
        camera.position
    );


    scene.add(bomb);


    const direction=
    new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    let distance=0;


    const bombTimer=
    setInterval(
        ()=>{

            distance+=.8;

            bomb.position.addScaledVector(
                direction,
                .8
            );


            bomb.position.y=
            camera.position.y+
            Math.sin(distance*.25)*2;


            if(distance>18){

                clearInterval(
                    bombTimer
                );

                explodeBomb(
                    bomb
                );

            }

        },
        30
    );

}


/* =====================================================
   BOMB EXPLOSION
===================================================== */

function explodeBomb(bomb){

    const explosion=
    new THREE.Mesh(

        new THREE.SphereGeometry(
            4,
            16,
            16
        ),

        new THREE.MeshBasicMaterial({
            color:0xff9900,
            transparent:true,
            opacity:.55
        })

    );


    explosion.position.copy(
        bomb.position
    );


    scene.add(explosion);


    enemies.forEach(
        enemy=>{

            const d=
            enemy.position.distanceTo(
                explosion.position
            );


            if(d<7){

                killEnemy(enemy);

            }

        }
    );


    scene.remove(bomb);


    setTimeout(
        ()=>{
            scene.remove(explosion);
        },
        180
    );

}


/* =====================================================
   RELOAD
===================================================== */

function reload(){

    ammo=
    currentGun===0 ? 12 :
    currentGun===1 ? 30 :
    currentGun===2 ? 25 :
    6;


    updateAmmo();

}


/* =====================================================
   AMMO
===================================================== */

function updateAmmo(){

    currentAmmo.innerText=
    ammo;

    maxAmmoEl.innerText=
    maxAmmo;

}


/* =====================================================
   SOUND
===================================================== */

function playSound(){

    if(!audioCtx)
        return;


    const osc=
    audioCtx.createOscillator();

    const gain=
    audioCtx.createGain();


    osc.type=
    currentGun===3?
    "sawtooth":
    "square";


    osc.frequency.setValueAtTime(

        currentGun===3?
        140:
        420,

        audioCtx.currentTime

    );


    osc.frequency.exponentialRampToValueAtTime(
        55,
        audioCtx.currentTime+.08
    );


    gain.gain.setValueAtTime(
        .25,
        audioCtx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+.08
    );


    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );


    osc.start();

    osc.stop(
        audioCtx.currentTime+.08
    );

}


/* =====================================================
   MOVEMENT
===================================================== */

function updateMovement(){

    /*
       Joystick:
       UP    = player forward
       DOWN  = backward
       LEFT  = left
       RIGHT = right
    */

    const speed=
    zoomed?
    .075:
    .13;


    const dir=
    new THREE.Vector3();


    camera.getWorldDirection(
        dir
    );


    dir.y=0;

    dir.normalize();


    const side=
    new THREE.Vector3(
        -dir.z,
        0,
        dir.x
    );


    if(moveY!==0){

        camera.position.addScaledVector(
            dir,
            -moveY*speed
        );

    }


    if(moveX!==0){

        camera.position.addScaledVector(
            side,
            moveX*speed
        );

    }


    /* WORLD BOUNDARY */

    camera.position.x=
    THREE.MathUtils.clamp(
        camera.position.x,
        -125,
        125
    );


    camera.position.z=
    THREE.MathUtils.clamp(
        camera.position.z,
        -125,
        125
    );

}


/* =====================================================
   ENEMY AI
===================================================== */

function updateEnemies(){

    const time=
    Date.now()*.007;


    enemies.forEach(
        enemy=>{

            const direction=
            new THREE.Vector3();


            direction.subVectors(
                camera.position,
                enemy.position
            );


            direction.y=0;


            const distance=
            direction.length();


            direction.normalize();


            /*
              ENEMY AGGRESSIVELY
              MOVES TOWARD PLAYER
            */

            if(distance>3){

                enemy.position
                .addScaledVector(
                    direction,
                    .045
                );

            }


            enemy.lookAt(
                camera.position.x,
                enemy.position.y,
                camera.position.z
            );


            /* WALKING ANIMATION */

            enemy.legs[0]
            .rotation.x=
            Math.sin(time)*.55;


            enemy.legs[1]
            .rotation.x=
            Math.sin(
                time+Math.PI
            )*.55;


            enemy.arms[0]
            .rotation.x=
            Math.sin(
                time+Math.PI
            )*.25;


            enemy.arms[1]
            .rotation.x=
            Math.sin(time)*.25;


            /* ATTACK */

            if(distance<4){

                damagePlayer();

            }

        }
    );

}


/* =====================================================
   PLAYER DAMAGE
===================================================== */

function damagePlayer(){

    const now=
    Date.now();


    if(
        now-lastDamage<
        800
    )
        return;


    lastDamage=now;


    health-=5;


    health=
    Math.max(
        0,
        health
    );


    healthBar.style.width=
    health+"%";


    healthText.innerText=
    health;


    damageText.style.display=
    "block";


    setTimeout(
        ()=>{
            damageText.style.display=
            "none";
        },
        300
    );


    if(health<=0){

        endGame();

    }

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    timeLeft=120;

    timeEl.innerText=
    timeLeft;


    timerInterval=
    setInterval(
        ()=>{

            if(!gameActive)
                return;


            timeLeft--;


            timeEl.innerText=
            timeLeft;


            if(timeLeft<=20){

                document
                .getElementById("timer")
                .classList.add(
                    "warning"
                );

            }


            if(timeLeft<=0){

                endGame();

            }

        },
        1000
    );

}


/* =====================================================
   END GAME
===================================================== */

function endGame(){

    gameActive=false;

    firing=false;


    clearInterval(
        timerInterval
    );


    finalScore.innerText=
    score;


    gameOver.style.display=
    "flex";

}


/* =====================================================
   RESTART
===================================================== */

restartBtn.onclick=()=>{

    location.reload();

};


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

    if(!gameActive)
        return;


    requestAnimationFrame(
        animate
    );


    if(firing)
        shoot();


    updateMovement();

    updateEnemies();


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        if(!camera)
            return;


        camera.aspect=
        innerWidth/innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>
